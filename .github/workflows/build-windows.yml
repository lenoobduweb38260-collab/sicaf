name: Application Windows (.exe)

# Construit l'application de bureau GMAO SICAF pour Windows 10/11 (Electron : Node.js intégré,
# aucune installation préalable, aucune fenêtre de commandes) :
#   - GMAO-SICAF-Setup-<version>.exe     installateur (mises à jour automatiques)
#   - GMAO-SICAF-Portable-<version>.exe  version portable (clé USB, sans installation)
#   - latest.json                        manifeste de mise à jour (version, empreinte SHA-256, signature Ed25519)
#
# Chaque push sur la branche par défaut publie une nouvelle version (Release GitHub « v1.0.<n> ») :
# les postes équipés de l'application la détectent et l'installent automatiquement.
# Les autres branches, et les commits marqués [wip], produisent les .exe en artefacts (onglet Actions)
# sans les publier ni les signer. Aucune étiquette ne déclenche de publication : une étiquette peut être
# posée sur n'importe quel commit, sans relecture.
#
# Secrets de signature, voir docs/MISES-A-JOUR.md :
#   - MAJ_CLE_PRIVEE    clé privée Ed25519 de signature du manifeste (scripts/generer-cle-maj.js) ;
#   - CSC_LINK          certificat de signature de code Windows (.pfx encodé en base64) ;
#   - CSC_KEY_PASSWORD  mot de passe de ce certificat.
# Ils sont rangés dans l'environnement GitHub « publication », réservé à la branche par défaut
# (Settings › Environments › publication › Deployment branches and tags), et non dans les secrets du
# dépôt : une exécution lancée depuis une autre branche, même avec un workflow modifié, ne les reçoit
# jamais. Ils ne servent qu'aux versions publiées, et chacun uniquement à l'étape qui en a besoin.
#
# Chaîne de construction verrouillée : actions épinglées par empreinte de commit (version en commentaire),
# dépendances installées avec « npm ci » depuis package-lock.json (obligatoire pour une version publiée).

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Droits minimaux par défaut ; seul le job de publication peut créer une Release.
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    outputs:
      # « oui » pour une version à publier : branche par défaut, hors commit [wip]
      publication: ${{ (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !contains(github.event.head_commit.message, '[wip]')) && 'oui' || 'non' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests API et application de bureau
        run: npm test

  windows:
    name: Installateur Windows
    needs: tests
    runs-on: windows-latest
    # Environnement protégé (secrets de signature) uniquement pour une version publiée
    environment: ${{ needs.tests.outputs.publication == 'oui' && 'publication' || '' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PUBLICATION: ${{ needs.tests.outputs.publication }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Le jeton n'est pas conservé dans .git/config : les scripts d'installation npm ne peuvent pas s'en servir
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Numéro de version
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${GITHUB_RUN_NUMBER}"
          npm pkg set version="$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION"

      - name: Installation d'Electron et d'electron-builder (versions verrouillées)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ "$PUBLICATION" = "oui" ]; then
            echo "::error title=Dépendances non verrouillées::package-lock.json est absent : une version signée et publiée ne peut pas être construite avec des dépendances résolues au moment de la construction (docs/MISES-A-JOUR.md, section 3)."
            exit 1
          else
            echo "::warning title=Dépendances non verrouillées::package-lock.json est absent : construction d'essai avec les dernières versions compatibles (aucune publication)."
            npm install --no-audit --no-fund
          fi

      # Placée après l'installation des paquets npm : leurs scripts d'installation ne voient jamais le certificat.
      - name: Certificat de signature de code (Authenticode)
        if: env.PUBLICATION == 'oui'
        shell: bash
        env:
          CERTIFICAT_BASE64: ${{ secrets.CSC_LINK }}
          CERTIFICAT_MOT_DE_PASSE: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CERTIFICAT_BASE64" ]; then
            echo "Secret CSC_LINK absent : les exécutables ne seront pas signés (Authenticode)."
            exit 0
          fi
          PFX="$(cygpath -u "$RUNNER_TEMP")/certificat-signature.pfx"
          # Base64 brut ou produit par « certutil -encode » (lignes BEGIN / END ignorées)
          if ! printf '%s' "$CERTIFICAT_BASE64" | sed '/-----/d' | tr -d ' \r\n\t' | base64 -d > "$PFX" 2>/dev/null || [ ! -s "$PFX" ]; then
            rm -f "$PFX"
            echo "::error title=Signature de code::Le secret CSC_LINK ne contient pas un certificat .pfx encodé en base64."
            exit 1
          fi
          # electron-builder lit CSC_LINK et CSC_KEY_PASSWORD dans l'environnement
          echo "CSC_LINK=$(cygpath -w "$PFX")" >> "$GITHUB_ENV"
          if [ -n "$CERTIFICAT_MOT_DE_PASSE" ]; then
            DELIMITEUR="FIN_$(node -p "require('crypto').randomBytes(16).toString('hex')")"
            {
              echo "CSC_KEY_PASSWORD<<$DELIMITEUR"
              printf '%s\n' "$CERTIFICAT_MOT_DE_PASSE"
              echo "$DELIMITEUR"
            } >> "$GITHUB_ENV"
          fi
          echo "SIGNATURE_CODE=oui" >> "$GITHUB_ENV"
          echo "Signature de code activée."

      - name: Construction de l'installateur et de la version portable
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Suppression du certificat de signature de code
        if: always() && env.PUBLICATION == 'oui'
        shell: bash
        run: |
          rm -f "$(cygpath -u "$RUNNER_TEMP")/certificat-signature.pfx"
          # Variables vidées : les étapes suivantes n'y ont plus accès
          echo "CSC_LINK=" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Contrôle de la signature Authenticode
        if: env.SIGNATURE_CODE == 'oui'
        shell: pwsh
        run: |
          $lignes = @('### Signature de code (Authenticode)', '', '| Fichier | État | Signataire |', '|---|---|---|')
          $echec = $false
          foreach ($f in Get-ChildItem dist -Filter 'GMAO-SICAF-*.exe' | Where-Object { $_.Extension -eq '.exe' }) {
            $s = Get-AuthenticodeSignature -FilePath $f.FullName
            $signataire = if ($s.SignerCertificate) { $s.SignerCertificate.Subject } else { '-' }
            $lignes += "| $($f.Name) | $($s.Status) | $signataire |"
            if ($s.Status -eq 'NotSigned' -or $s.Status -eq 'HashMismatch') { $echec = $true }
          }
          $lignes | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          $lignes | Write-Output
          if ($echec) { Write-Output '::error title=Signature de code::Un exécutable n''est pas signé alors que le certificat est configuré.'; exit 1 }

      - name: Message du commit (notes de version)
        shell: bash
        run: git log -1 --pretty=format:"%s%n%n%b" > notes-commit.txt

      - name: Manifeste de mise à jour (latest.json)
        # Signé (Ed25519) avec le secret MAJ_CLE_PRIVEE pour une version publiée. Sans ce secret, le manifeste
        # n'est pas signé (avertissement) : les postes dont la clé publique est configurée le refuseront.
        # Les notes sont nettoyées (en-têtes de fin, mentions d'outils, identifiants de session) par
        # scripts/manifeste-maj.js, qui écrit aussi dist/notes.txt : le texte de la publication est celui signé.
        shell: bash
        env:
          MAJ_CLE_PRIVEE: ${{ env.PUBLICATION == 'oui' && secrets.MAJ_CLE_PRIVEE || '' }}
        run: node scripts/manifeste-maj.js dist "$VERSION" notes-commit.txt dist/notes.txt

      - name: Artefacts (.exe)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GMAO-SICAF-${{ env.VERSION }}
          path: |
            dist/GMAO-SICAF-Setup-*.exe
            dist/GMAO-SICAF-Portable-*.exe
            dist/latest.json
            dist/notes.txt
          if-no-files-found: error

  publication:
    name: Publication de la version
    # Job distinct, sans aucun code du dépôt ni paquet npm : seul lui détient le droit d'écrire (Release)
    needs: [tests, windows]
    if: needs.tests.outputs.publication == 'oui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - name: Fichiers construits et signés
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: GMAO-SICAF-${{ needs.windows.outputs.version }}
          path: dist

      - name: Publication de la version (mises à jour automatiques)
        id: publication
        # GitHub refuse de créer l'étiquette lorsque le commit modifie lui-même un fichier de .github/workflows
        # (le jeton du workflow n'a pas ce droit) : l'échec n'interrompt pas le job et il est signalé ci-dessous.
        continue-on-error: true
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          name: GMAO SICAF ${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: dist/notes.txt
          make_latest: true
          files: |
            dist/GMAO-SICAF-Setup-*.exe
            dist/GMAO-SICAF-Portable-*.exe
            dist/latest.json

      - name: Avertissement (version non publiée)
        if: steps.publication.outcome == 'failure'
        shell: bash
        env:
          FICHIERS_COMMIT: ${{ join(github.event.head_commit.added, ' ') }} ${{ join(github.event.head_commit.modified, ' ') }} ${{ join(github.event.head_commit.removed, ' ') }}
        run: |
          {
            echo "### Attention : version $VERSION non publiée"
            echo
            echo "GitHub a refusé de créer l'étiquette \`v$VERSION\` ou la Release : les postes ne recevront pas cette version."
            echo "Cause habituelle : le commit modifie lui-même un fichier de \`.github/workflows\`, ce que le jeton du"
            echo "workflow (GITHUB_TOKEN) n'a pas le droit de publier."
            case " $FICHIERS_COMMIT " in
              *".github/workflows/"*) echo; echo "C'est le cas ici : ce commit modifie un fichier de workflow." ;;
            esac
            echo
            echo "Les exécutables et latest.json (déjà signés) restent disponibles dans les artefacts de cette exécution."
            echo "Pour publier : poussez un commit suivant qui ne modifie pas les workflows, ou créez la Release depuis un"
            echo "poste autorisé avec ces fichiers (docs/MISES-A-JOUR.md, section 9)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Version non publiée::GitHub a refusé la publication de v$VERSION (voir le résumé du job). Les .exe sont dans les artefacts."
